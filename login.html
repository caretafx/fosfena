<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Fosfena</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#18191C">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/fosfena.css">
<style>
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.split{flex:1;display:grid;grid-template-columns:1fr 1fr}
.art{background:var(--fos-roxo);padding:40px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.art .big{position:absolute;right:-60px;bottom:-40px;width:min(520px,80%);opacity:.18;color:var(--fg)}
.art blockquote{margin:0;max-width:22em;position:relative}
.art blockquote p{font-family:var(--f-display);font-size:clamp(26px,3vw,38px);font-weight:600;letter-spacing:-.03em;line-height:1.1}
.art .mao{font-size:19px;display:block;margin-top:16px;transform:rotate(-2deg);transform-origin:left}
.side{display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{width:min(400px,100%);display:flex;flex-direction:column;gap:22px}
.card h1{font-size:34px}
.card .sub{color:var(--muted)}
form{display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:7px;font-size:14px;font-weight:500;color:var(--soft)}
input[type=email],input[type=password]{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--fg);width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.row label{flex-direction:row;align-items:center;gap:8px;font-weight:400;color:var(--muted)}
.row input{accent-color:var(--accent);width:16px;height:16px}
.row a,.alt a{color:var(--link)}
.row a:hover,.alt a:hover{text-decoration:underline}
.err{color:#e8a39a;font-size:14px;min-height:1.2em}
.alt{color:var(--muted);font-size:14.5px;border-top:1px solid var(--line);padding-top:20px}
.note{font-size:13px;color:var(--faint);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
@media (max-width:820px){ .split{grid-template-columns:1fr} .art{padding:24px 16px;min-height:0} .art blockquote{display:none} .art .big{display:none} }
</style>
<link rel="stylesheet" href="assets/fx.css">
<style>
.art{background:rgba(59,42,82,.45)!important;-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-right:1px solid rgba(236,234,228,.08)}
.card{padding:32px;border-radius:20px}
input[type=email],input[type=password]{background:rgba(20,21,24,.55)!important}
@media (max-width:820px){.card{padding:22px}}
</style>
</head>
<body>
<div class="split">
  <aside class="art">
    <a class="brand" href="index.html" aria-label="Fosfena, página inicial"><img src="assets/logo.svg" alt="fosfena" width="147" height="34"></a>
    <blockquote><p>Seu próximo plano está esperando no Node Graph.</p><span class="mao">continue de onde parou ↘</span></blockquote>
    <svg class="big" viewBox="0 0 64 64" aria-hidden="true"><g transform="translate(32 32) rotate(-45) scale(.92) translate(-32 -32)" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M20 26 H50 V38 H20 Z"/><path d="M50 26 H55 A4 6 0 0 1 55 38 H50"/><path d="M20 26 L8 32 L20 38"/><path d="M24 32 H46" stroke-width="1.2" opacity=".55"/></g></svg>
  </aside>
  <main class="side">
    <div class="card">
      <div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Área do aluno</span><h1>Entrar</h1><p class="sub">Use o e-mail da sua assinatura.</p></div>
      <form id="f" novalidate>
        <label>E-mail<input type="email" id="email" autocomplete="email" placeholder="voce@email.com" required></label>
        <label>Senha<input type="password" id="pw" autocomplete="current-password" placeholder="••••••••" required></label>
        <div class="row"><label><input type="checkbox" checked> Manter conectado</label><a href="#" id="forgot">Esqueci minha senha</a></div>
        <p class="err" id="err" role="alert"></p>
        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      </form>
      <p class="note">Prévia: o login ainda não confere senha. Qualquer e-mail abre a área do aluno de exemplo.</p>
      <p class="alt">Ainda não é aluno? <a href="index.html#precos">Conheça os planos</a></p>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const f=document.getElementById('f'), err=document.getElementById('err');
f.addEventListener('submit',e=>{
  e.preventDefault();
  const em=document.getElementById('email').value.trim(), pw=document.getElementById('pw').value;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ err.textContent='Digite um e-mail válido.'; return; }
  if(!pw){ err.textContent='Digite sua senha.'; return; }
  err.textContent='';
  try{ localStorage.setItem('fosfena-sessao', JSON.stringify({email:em})); }catch(x){}
  location.href='aluno.html';
});
let t; document.getElementById('forgot').addEventListener('click',e=>{ e.preventDefault(); const el=document.getElementById('toast'); el.textContent='Na versão final, enviamos um link para redefinir a senha.'; el.classList.add('show'); clearTimeout(t); t=setTimeout(()=>el.classList.remove('show'),2800); });
</script>
<script>window.FX={glass:'.card',glow:'.btn-ghost',tilt:'',reveal:'.card>*',words:'.art blockquote p'};</script>
<script src="assets/fx.js" defer></script>
<script src="assets/fluid.js" defer></script>
</body>
</html>
