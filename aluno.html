<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Área do aluno · Fosfena</title>
<script>try{if(!localStorage.getItem("fosfena-sessao"))location.replace("login.html")}catch(e){}</script>
<meta name="description" content="Fosfena, escola de VFX. Prévia da área do aluno.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#18191C">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>body{margin:0}</style>
<link rel="stylesheet" href="assets/fx.css">
<link rel="stylesheet" href="assets/neon.css">
<style>
body{background:#141518!important}
.side{border-right:1px solid rgba(236,234,228,.08)!important;border-top:0!important;border-left:0!important;border-bottom:0!important;box-shadow:none!important}
.mcard.later{background:rgba(38,40,46,.2)}
.continue{background:rgba(59,42,82,.7)!important;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 30px 80px -30px rgba(59,42,82,.9),inset 0 1px 0 rgba(255,255,255,.08)}
.poster{background:repeating-linear-gradient(180deg,transparent 0 35px,rgba(127,156,192,.08) 35px 36px),rgba(29,31,35,.85)!important}
.lrow,.litem{transition:background .2s}
textarea{background:rgba(20,21,24,.5)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@media (max-width:760px){.side{border-right:0!important;border-bottom:1px solid rgba(236,234,228,.08)!important}}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral fixa + área de conteúdo; na aula, player grande com a lista de aulas ao lado. Cores e fontes do guia de marca Fosfena v1.0 (tokens --fos-*): grafite, giz e um único âmbar, sem gradientes. */
:root{
  --fos-grafite:#18191C; --fos-lousa:#232529; --fos-lousa-2:#2E3036; --fos-giz:#ECEAE4; --fos-cinza:#8B8E96;
  --fos-ambar:#E0A84E; --fos-azul:#7F9CC0; --fos-roxo:#3B2A52;
  --fos-mao:"Shantell Sans", "Comic Neue", ui-rounded, system-ui, sans-serif;
  --bg:var(--fos-grafite); --panel:var(--fos-lousa); --raise:var(--fos-lousa-2); --line:rgba(236,234,228,.11);
  --fg:var(--fos-giz); --soft:#c4c3c0; --muted:#aeb0b5; --faint:var(--fos-cinza);
  --accent:var(--fos-ambar); --accent-ink:var(--fos-grafite); --link:var(--fos-azul); --focus:var(--fos-ambar);
  --f-display:"Instrument Sans", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:12px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.025em;line-height:1.1;margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:26px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;overflow-y:auto;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand svg{width:32px;height:32px;flex:none;color:var(--fg);overflow:visible}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-.035em}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--raise);color:var(--fg)}
.nav a.on{background:var(--raise);color:var(--fg)}
.nav a.on .ic{color:var(--accent)}
.ic{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:8px}
.side-foot .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
/* main */
main{min-width:0;padding-block:28px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:500}
.demo-note{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
/* home */
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.continue{background:var(--fos-roxo);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.continue .thumb{min-height:200px}
.continue .body{padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.continue h2{font-size:24px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;font-weight:600;font-size:14px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{box-shadow:inset 0 0 0 1px var(--line);color:var(--fg)}
.btn-ghost:hover{background:var(--raise)}
.stats{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:84px;height:84px;flex:none}
.ring b{font-family:var(--f-display);font-weight:600;letter-spacing:-.03em;font-size:28px;display:block;line-height:1}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv>div:nth-child(5){grid-column:1/-1}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv span{font-size:12px;color:var(--faint)}
.kv strong{font-family:var(--f-mono);font-weight:500;font-size:15px}
.module{display:flex;flex-direction:column;gap:12px}
.module-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.module-head h2{font-size:22px}
.module-head .meta{color:var(--muted);font-size:13px}
.lessons{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.lrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto 120px;gap:16px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--raise)}
.lrow .t{font-weight:600}
.lrow .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .d{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.state{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.state.done{background:var(--accent);border-color:var(--accent);color:var(--fos-grafite);font-weight:700}
.state.prog{border-color:var(--accent);color:var(--accent)}
.soon{background:var(--fos-roxo);border-radius:12px;padding:18px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;color:var(--fg)}
.soon .tag{border-color:var(--accent);color:var(--accent)}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.acc{border-color:var(--accent);color:var(--accent)}
/* poster */
.poster{position:relative;background:repeating-linear-gradient(180deg,transparent 0 35px,rgba(127,156,192,.08) 35px 36px),#1d1f23;overflow:hidden;display:flex;align-items:flex-end}
.poster .graph{position:absolute;inset:0;width:100%;height:100%}
.poster .mao{position:absolute;left:22px;top:44%;font-family:var(--fos-mao);font-weight:600;font-size:clamp(14px,1.6vw,19px);color:var(--accent);transform:rotate(-3deg)}
.poster .cap{position:relative;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.poster .num{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.06em}
.poster .ttl{font-family:var(--f-display);font-weight:600;letter-spacing:-.025em;font-size:clamp(18px,2.4vw,30px);line-height:1.1}
/* lesson page */
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.crumbs{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.crumbs a{color:var(--link)}.crumbs a:hover{text-decoration:underline}
.player{border-radius:var(--r);overflow:hidden;background:var(--fos-grafite)}
.screen{aspect-ratio:16/9;max-width:100%;position:relative;cursor:pointer}
.screen .poster{position:absolute;inset:0}
.bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--fos-grafite);display:grid;place-items:center;transition:transform .15s}
.screen:hover .bigplay{transform:translate(-50%,-50%) scale(1.06)}
.bigplay svg{width:26px;height:26px;margin-left:3px;color:var(--fos-grafite)}
.playing .bigplay{opacity:0}
.sample{position:absolute;top:12px;left:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:rgba(24,25,28,.8);padding:4px 8px;border-radius:6px;color:var(--muted)}
.controls{background:var(--panel);padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
.scrub{height:6px;background:var(--line);border-radius:99px;position:relative;cursor:pointer}
.scrub i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.scrub b{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--fg);transform:translate(-50%,-50%)}
.crow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cbtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.cbtn:hover{background:var(--raise)}
.cbtn svg{width:18px;height:18px}
.tc{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tc strong{color:var(--fg);font-weight:500}
.spacer{flex:1}
.speed{font-family:var(--f-mono);font-size:12.5px;padding:5px 9px;border:1px solid var(--line);border-radius:6px}
.lesson-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.lesson-head h1{font-size:30px}
.done-btn.is-done{background:var(--accent);color:var(--fos-grafite);box-shadow:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:10px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.tabpanel{display:flex;flex-direction:column;gap:16px;max-width:72ch}
.tabpanel p{margin:0;color:var(--soft)}
.topics{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--soft)}
.nodes{display:flex;flex-wrap:wrap;gap:6px}
.node{font-family:var(--f-mono);font-size:12.5px;padding:4px 10px;border-radius:8px;background:var(--raise)}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.specs div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.specs span{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.specs strong{font-family:var(--f-mono);font-weight:500;font-size:14px}
.files{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.file{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.file:first-child{border-top:0}
.ext{font-family:var(--f-mono);font-size:11px;font-weight:500;width:40px;height:30px;border-radius:6px;display:grid;place-items:center;background:var(--raise);color:var(--muted);border:1px solid var(--line)}
.ext.nk{color:var(--accent);border-color:rgba(224,168,78,.4)}
.file .n{font-family:var(--f-mono);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .r{font-size:12.5px;color:var(--muted)}
.file .sz{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.step input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px}
.step.ok span{color:var(--muted);text-decoration:line-through}
.quiz{display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.q{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q legend{font-weight:600;padding:0;margin-bottom:4px;float:left;width:100%}
.q .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:block;margin-bottom:4px;font-weight:400}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover{border-color:rgba(155,107,255,.6)}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt.right{border-color:#5fd38d;background:rgba(95,211,141,.1)}
.opt.wrong{border-color:#e8746a;background:rgba(232,116,106,.1)}
.q .why{font-size:13.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:10px;display:none}
.quiz.checked .why{display:block}
.quiz.checked .opt{cursor:default}
.score{display:flex;gap:16px;align-items:center;padding:16px;border-radius:12px;background:rgba(155,107,255,.12);border:1px solid rgba(155,107,255,.45)}
.score b{font-family:var(--f-display);font-size:40px;letter-spacing:-.03em;line-height:1}
.score.pass b{color:var(--accent)}
.qbadge{font-family:var(--f-mono);font-size:11.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.qbadge.ok{border-color:rgba(255,181,71,.6);color:var(--accent)}
.community{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.ccard{border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.ccard h2{font-size:24px}
.chans{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.chans li{display:flex;gap:10px;align-items:baseline}
.chans b{font-family:var(--f-mono);font-size:13.5px;color:var(--neon-ciano,#7F9CC0);white-space:nowrap}
.chans span{color:var(--muted);font-size:14px}
.discord-cta{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;padding:16px 18px;border-radius:14px;background:linear-gradient(120deg,rgba(88,101,242,.28),rgba(155,107,255,.18));border:1px solid rgba(124,134,255,.55);box-shadow:0 0 24px -8px rgba(124,134,255,.7)}
.discord-cta .dl-ic{width:34px;height:34px;flex:none;color:#c9cdff}
@media (max-width:900px){.community{grid-template-columns:1fr}}
.deliver{background:var(--fos-roxo);border-radius:10px;padding:16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
textarea{width:100%;min-height:160px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:inherit;padding:12px;resize:vertical;box-sizing:border-box}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);overflow:hidden}
.list header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.list header b{font-family:var(--f-display);font-weight:600;font-size:16px}
.list .grp{padding:10px 16px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.litem{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 16px}
.litem:hover{background:var(--raise)}
.litem.cur{background:var(--raise);box-shadow:inset 3px 0 0 var(--accent)}
.litem .t{font-size:14px;font-weight:500;line-height:1.3}
.litem .d{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.litem.lock{opacity:.5;cursor:default}
.litem.lock:hover{background:none}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* exercises */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ex .poster{aspect-ratio:16/9}
.ex .b{padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.ex .b h3{font-size:17px}
.ex .b p{margin:0;color:var(--muted);font-size:13.5px}
.ex .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.ex.ph{border-style:dashed;background:none}
.ex.ph .poster{background:repeating-linear-gradient(135deg,var(--fos-lousa) 0 10px,var(--fos-grafite) 10px 20px)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fos-giz);color:var(--fos-grafite);padding:10px 16px;border-radius:8px;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);z-index:20}
.toast.show{opacity:1;transform:translateX(-50%)}
/* módulos */
.code{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--accent);border:1px solid rgba(224,168,78,.45);border-radius:6px;padding:2px 7px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;min-height:200px}
a.mcard:hover{background:var(--raise)}
.mcard h3{font-size:21px}
.mcard p{margin:0;color:var(--muted);font-size:14px}
.mcard .mfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.mcard.later{background:none;border-style:dashed}
.mhead{display:flex;flex-direction:column;gap:10px}
.mhead h1{font-size:34px}
.mhead p{margin:0;color:var(--muted);max-width:62ch}
.who{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted);overflow:hidden}
.who b{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.out{color:var(--link);font-size:12.5px;text-align:left;padding:0;align-self:flex-start}
.out:hover{text-decoration:underline}
@media (max-width:1000px){
  .lesson{grid-template-columns:1fr}
  .list{position:static}
  .hero{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));gap:12px;z-index:5;border-right:0;border-bottom:1px solid var(--line)}
  .brand small,.side-foot{display:none}
  .nav{flex-direction:row;margin-left:auto;gap:0}
  .nav a span{display:none}

<script>
const COURSE = [
  { id:'NK101', code:'NK101', tool:'Nuke', title:'Fundamentos do Nuke', desc:'Tudo o que você precisa para começar a trabalhar no Nuke, da instalação aos primeiros trabalhos de comp.', lessons:[
    { id:'aula-1', n:1, title:'Como instalar o Nuke', dur:599.37,

      topics:['Onde baixar o Nuke e quais licenças existem para estudo','Instalação passo a passo no Windows','Ativação da licença e primeira abertura','Ajustes iniciais antes de começar'],

    { id:'aula-2', n:2, title:'Iniciando o Nuke', dur:1189.07,
      summary:'Um tour pela interface e pela lógica de nodes. Ao final você sabe trazer um footage, navegar pelo Node Graph e ver o resultado no Viewer.',
      topics:['Painéis: Node Graph, Viewer e Properties','Como os nodes se conectam e o fluxo da imagem','Project Settings: formato, fps e frame range','Ler um footage com Read e renderizar com Write'],

    { id:'aula-3', n:3, title:'Primeiro apagamento', dur:2412.73, note:'congela, pinta, reaplica ↘',

      nodes:['Read','Tracker4','FrameHold','RotoPaint','Roto','CornerPin2D','Transform','Merge2','Write'],
      specs:[['Formato','2160 × 3840'],['Frames','1 – 101'],['FPS','24'],['Orientação','Vertical']],
      exercise:['Abra o aula03_v01.nk ou comece do zero com o ftg.mov','Trackeie a área a ser apagada com Tracker','Escolha um frame de referência e congele com FrameHold','Pinte o clean plate no RotoPaint','Recorte o patch com Roto e reaplique o movimento com CornerPin','Renderize o resultado de 1 a 101 e compare com aula03_v01.mov'],
      files:[['mov','ftg.mov','Footage da aula','362 MB'],['nk','aula03_v01.nk','Script do Nuke','223 KB'],['mov','aula03_v01.mov','Resultado de referência','354 MB']] },
    { id:'aula-4', n:4, title:'Primeira tela', dur:1585.43, note:'a matte manda em tudo ↘',
      summary:'Substituição de tela. Você extrai a tela com um keyer, trackeia o movimento, encaixa a nova imagem e integra com cor, blur e bordas.',
      topics:['Keyer e refinamento da matte com FilterErode, Blur e Invert','Tracking da tela e encaixe da nova imagem','Copy e Premult para combinar o alpha','Integração de cor com Grade e HueCorrect','Reformat e render em HD'],
      nodes:['Read','Keyer','Tracker4','Roto','FilterErode','Blur','Invert','Copy','Premult','Grade','HueCorrect','Reformat','CheckerBoard2','Transform','Merge2','Write'],
      specs:[['Formato do render','1920 × 1080'],['Frames','1 – 65'],['FPS','24'],['Footage','4K DCP']],
      exercise:['Leia o ftg.mov e extraia a tela com Keyer','Limpe a matte com FilterErode e Blur','Trackeie os cantos da tela','Encaixe uma imagem nova no lugar (use o CheckerBoard para testar)','Ajuste cor com Grade e HueCorrect para integrar','Renderize em 1920 × 1080, frames 1 a 65'],
      files:[['mov','ftg.mov','Footage da aula','363 MB'],['nk','aula04_v01.nk','Script do Nuke','27 KB'],['mov','aula04_v01.mov','Resultado de referência','56 MB']] },
  ]},
  { id:'NK102', code:'NK102', tool:'Nuke', title:'Projeto Básico Nuke', soon:true, note:'Exercícios de um projeto completo, cada um com footage, script inicial e resultado esperado.' },
  { id:'FL101', code:'FL101', tool:'Flame', title:'Fundamentos do Flame', soon:true, note:'Primeiros passos no Flame. Aulas em gravação.' },
];
const LESSONS = COURSE.flatMap(m => (m.lessons||[]).map(l => ({...l, module:m})));
const TOTAL = LESSONS.reduce((s,l)=>s+l.dur,0);

// Provas: perguntas de múltipla escolha no fim de cada aula. a = índice da resposta certa.
const QUIZ = {
  'aula-1':[
    {q:'Qual licença da Foundry é gratuita para estudar, sem uso comercial?', o:['Nuke Indie','Nuke Non-commercial','NukeX','Nuke Studio'], a:1, why:'A Non-commercial é gratuita para aprender. A Indie é paga, mas barata, para quem fatura pouco.'},
    {q:'Qual é a principal limitação de render da licença Non-commercial?', o:['Só renderiza 10 frames','Não abre arquivos .mov','O render fica limitado a resolução HD','Não tem o node Write'], a:2, why:'Você pode trabalhar normalmente, mas o render sai limitado a 1920 × 1080.'},
    {q:'De onde você deve baixar o Nuke?', o:['De qualquer site de downloads','Do site oficial da Foundry','De um torrent','Ele já vem no Windows'], a:1, why:'Baixe sempre do site da Foundry: é seguro e a licença funciona sem dor de cabeça.'},
  ],
  'aula-2':[
    {q:'Qual node traz um footage para dentro do script?', o:['Write','Viewer','Read','Merge'], a:2, why:'O Read lê o arquivo do disco. O atalho é a tecla R no Node Graph.'},
    {q:'Onde você vê o resultado da imagem?', o:['No Viewer','No Properties','No Dope Sheet','No Script Editor'], a:0, why:'O Viewer mostra a imagem do node que está conectado a ele.'},
    {q:'Onde se ajusta formato, fps e frame range do projeto?', o:['No node Read','Em Project Settings','No Viewer','No Write'], a:1, why:'Project Settings abre com a tecla S sobre o Node Graph.'},
    {q:'Qual node grava o resultado final no disco?', o:['Read','Write','Shuffle','Backdrop'], a:1, why:'O Write define o caminho e o formato do arquivo e faz o render.'},
  ],
  'aula-3':[
    {q:'Para que serve o FrameHold nesse apagamento?', o:['Acelerar o render','Congelar um frame para pintar o clean plate','Estabilizar a câmera','Trocar o fps do plano'], a:1, why:'Você pinta uma vez em um frame congelado e depois reaplica o movimento.'},
    {q:'Qual node usamos para pintar o clean plate?', o:['RotoPaint','Grade','Blur','Keyer'], a:0, why:'O RotoPaint tem clone e paint para cobrir o que precisa sumir.'},
    {q:'O que o Tracker entrega para reaplicar o patch?', o:['Uma matte pronta','O movimento da área ao longo dos frames','A cor média do plano','Um arquivo .mov'], a:1, why:'Os dados de track alimentam o CornerPin ou o Transform para o patch seguir a cena.'},
    {q:'Qual node coloca o patch por cima da imagem original?', o:['Copy','Merge','Reformat','Read'], a:1, why:'O Merge, na operação over, junta o patch (A) sobre o plano (B).'},
  ],
  'aula-4':[
    {q:'Para que serve o Keyer nesta aula?', o:['Gerar uma matte (alpha) da tela','Trackear os cantos','Mudar o formato do render','Corrigir a cor da imagem nova'], a:0, why:'O Keyer cria o alpha a partir da imagem, isolando a tela.'},
    {q:'O que o FilterErode faz com a matte?', o:['Muda a cor dela','Encolhe ou expande as bordas','Inverte preto e branco','Apaga a matte'], a:1, why:'Valores positivos encolhem e negativos expandem a matte.'},
    {q:'O que o Premult faz?', o:['Multiplica o RGB pelo alpha','Duplica o alpha','Aumenta o contraste','Converte para HD'], a:0, why:'Premultiplicar recorta a imagem pelo alpha antes do Merge.'},
    {q:'Qual node muda a resolução para 1920 × 1080 antes do render?', o:['Transform','Crop','Reformat','Grade'], a:2, why:'O Reformat adapta a imagem a um novo formato.'},
  ],
};
const PASS = 0.7;
// Link provisório: troque pelo convite do servidor quando ele existir.
const DISCORD_URL = '';


// Progresso de exemplo para o preview; salvo só neste navegador.
const DEFAULT = { 'aula-1':{pos:599.37,done:true}, 'aula-2':{pos:512,done:false} };
const KEY = 'fosfena-preview-v1';
let S = load();
function load(){ try{ const v = JSON.parse(localStorage.getItem(KEY)); if(v && v.prog){ v.quiz=v.quiz||{}; return v; } }catch(e){} return {prog:JSON.parse(JSON.stringify(DEFAULT)), notes:{}, steps:{}, quiz:{}}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const P = id => S.prog[id] || (S.prog[id] = {pos:0,done:false});

const fmt = s => { s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h? `${h}h${String(m).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`; };
const fmtMin = s => { const m=Math.round(s/60); return m>=60? `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}` : `${m} min`; };
const tc = s => { const f=Math.floor((s%1)*30), t=Math.floor(s); return [Math.floor(t/3600),Math.floor(t%3600/60),t%60,f].map(v=>String(v).padStart(2,'0')).join(':'); };
const esc = t => String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function stats(){
  const done = LESSONS.filter(l=>P(l.id).done).length;
  const watched = LESSONS.reduce((s,l)=>s+(P(l.id).done? l.dur : Math.min(P(l.id).pos,l.dur)),0);
  return {done, watched, pct: watched/TOTAL};
}
function quizAvg(){ const r=Object.values(S.quiz||{}); if(!r.length) return null; return r.reduce((a,x)=>a+x.best/x.total,0)/r.length; }
function qBadge(l){ const r=(S.quiz||{})[l.id]; if(!QUIZ[l.id]) return ''; return r? `<span class="qbadge ${r.best/r.total>=PASS?'ok':''}" title="Melhor nota na prova">Prova ${r.best}/${r.total}</span>` : `<span class="qbadge" title="Prova ainda não feita">Prova</span>`; }
function nextLesson(){ return LESSONS.find(l=>!P(l.id).done) || LESSONS[LESSONS.length-1]; }

// Pôster: mini node graph da aula (ou o título, se a aula não tem nodes)
function poster(l, big){
  const nodes = (l.nodes||[]).slice(0, big?9:7);
  let g = '';
  if(nodes.length){
    const W=640,H=360, cols=Math.min(nodes.length,3), x0=W*0.38;
    const pts = nodes.map((n,i)=>({n, x: x0 + (i%cols)*((W-x0-40)/Math.max(cols,1)) + (Math.floor(i/cols)%2? 40:0), y: 34 + Math.floor(i/cols)*58}));
    let lines='', boxes='';
    pts.forEach((p,i)=>{ if(i){ const q=pts[i-1]; lines+= q.y===p.y ? `<path d="M${q.x+92} ${q.y+12} L${p.x} ${p.y+12}" stroke="#8B8E96" stroke-opacity=".7" stroke-width="1.5" fill="none"/>` : `<path d="M${q.x+46} ${q.y+24} C${q.x+46} ${q.y+44}, ${p.x+46} ${p.y-20}, ${p.x+46} ${p.y}" stroke="#8B8E96" stroke-opacity=".7" stroke-width="1.5" fill="none"/>`; }
      boxes+=`<g><rect x="${p.x}" y="${p.y}" width="92" height="24" rx="4" fill="${i===0?'#E0A84E':'#2E3036'}"/><text x="${p.x+46}" y="${p.y+16}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10.5" fill="${i===0?'#18191C':'#ECEAE4'}">${esc(p.n)}</text></g>`; });
    g = `<svg class="graph" viewBox="0 0 640 360" preserveAspectRatio="xMaxYMin slice" aria-hidden="true">${lines}${boxes}</svg>`;
  } else {
    g = `<svg class="graph" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#sim" x="370" y="20" width="250" height="250" opacity=".55" style="color:#ECEAE4"/></svg>`;
  }
  return `<div class="poster ${big?'':'thumb'}">${g}${l.note&&big?`<span class="mao">${esc(l.note)}</span>`:''}<div class="cap"><span class="num">${l.module.code} · AULA ${String(l.n).padStart(2,'0')}</span><span class="ttl">${esc(l.title)}</span></div></div>`;
}
function stateIcon(l){ const p=P(l.id); if(p.done) return `<span class="state done" aria-label="Concluída">✓</span>`; if(p.pos>5) return `<span class="state prog" aria-label="Em andamento">${String(l.n).padStart(2,'0')}</span>`; return `<span class="state">${String(l.n).padStart(2,'0')}</span>`; }

function sidebar(){
  const s=stats();
  document.getElementById('sideBar').style.width = (s.pct*100).toFixed(1)+'%';
  document.getElementById('sideTxt').textContent = `${s.done} de ${LESSONS.length} aulas · ${Math.round(s.pct*100)}%`;
}

function home(){
  const s=stats(), nx=nextLesson(), p=P(nx.id), r=34, C=2*Math.PI*r;
  return `
    <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Área do aluno</span><h1 style="font-size:34px">Bem-vindo de volta</h1></div>
    <div class="hero">
      <a class="continue" href="#${nx.id}">
        ${poster(nx)}
        <div class="body">
          <span class="eyebrow">${p.pos>5?'Continue de onde parou':'Próxima aula'}</span>
          <h2>${esc(nx.title)}</h2>
          <span style="color:var(--muted);font-size:14px">${esc(nx.module.code)} · ${esc(nx.module.title)} · ${fmt(nx.dur)}</span>
          <div class="bar"><i style="width:${Math.round(p.pos/nx.dur*100)}%"></i></div>
          <span class="tc">${p.pos>5?`Parou em <strong>${fmt(p.pos)}</strong> de ${fmt(nx.dur)}`:'Ainda não começou'}</span>
          <span class="btn btn-primary" style="align-self:flex-start;margin-top:auto">${p.pos>5?'Continuar aula':'Começar aula'}</span>
        </div>
      </a>
      <div class="stats">
        <div class="ring">
          <svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-s.pct)}" transform="rotate(-90 42 42)"/></svg>
          <div><b>${Math.round(s.pct*100)}%</b><span style="color:var(--muted);font-size:13px">do conteúdo publicado</span></div>
        </div>
        <div class="kv">
          <div><span>Aulas concluídas</span><strong>${s.done} / ${LESSONS.length}</strong></div>
          <div><span>Tempo assistido</span><strong>${fmtMin(s.watched)}</strong></div>
          <div><span>Conteúdo total</span><strong>${fmtMin(TOTAL)}</strong></div>
          <div><span>Exercícios</span><strong>${LESSONS.filter(l=>l.exercise).length} abertos</strong></div>
          <div><span>Média nas provas</span><strong>${quizAvg()===null?'—':Math.round(quizAvg()*100)+'%'}</strong></div>
        </div>
      </div>
    </div>
    <p class="demo-note">Prévia com progresso de exemplo. O que você assistir ou marcar aqui fica salvo só neste navegador. <button class="mono" style="text-decoration:underline;color:var(--fg)" id="reset">Recomeçar a prévia</button></p>
    ${discordCta()}
    <section class="module"><div class="module-head"><h2>Seus módulos</h2><a class="meta" href="#modulos" style="color:var(--link)">Ver todos</a></div>${modCards()}</section>`;
}

let timer=null, speedIdx=0; const SPEEDS=[1,1.25,1.5,2];
function lessonView(l){
  const i=LESSONS.indexOf(l), prev=LESSONS[i-1], next=LESSONS[i+1], p=P(l.id);
  const tabs = [['sobre','Sobre a aula'],['materiais','Materiais'],['exercicio','Exercício'],['prova','Prova'],['notas','Anotações']].filter(t=> t[0]!=='materiais'||l.files.length).filter(t=>t[0]!=='exercicio'||l.exercise).filter(t=>t[0]!=='prova'||QUIZ[l.id]);
  const list = COURSE.map(m=>`<div class="grp">${m.code} · ${esc(m.title)}</div>` + (m.soon? `<div class="litem lock"><span class="state">·</span><span class="t">${esc(m.note)}</span><span class="tag">Em breve</span></div>` :
    m.lessons.map(x=>`<a class="litem ${x.id===l.id?'cur':''}" href="#${x.id}">${stateIcon(x)}<span class="t">${esc(x.title)}</span><span class="d">${fmt(x.dur)}</span></a>`).join(''))).join('');
  const s=stats();
  return `
    <div class="crumbs"><a href="#inicio">Início</a><span>›</span><a href="#${l.module.id}">${l.module.code} · ${esc(l.module.title)}</a><span>›</span><span style="color:var(--fg)">Aula ${l.n}</span></div>
    <div class="lesson">
      <div style="display:flex;flex-direction:column;gap:22px;min-width:0">
        <div class="player">
          <div class="screen" id="screen" role="button" tabindex="0" aria-label="Reproduzir ou pausar">${poster(l,true)}<span class="sample">Prévia · sem vídeo real</span><span class="bigplay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></span></div>
          <div class="controls">
            <div class="scrub" id="scrub" role="slider" aria-label="Posição do vídeo" tabindex="0"><i id="fill"></i><b id="knob"></b></div>
            <div class="crow">
              <button class="cbtn" id="pp" aria-label="Reproduzir"><svg viewBox="0 0 24 24" fill="currentColor" id="ppIc"><path d="M7 4.5v15l13-7.5z"/></svg></button>
              <button class="cbtn" id="back" aria-label="Voltar 10 segundos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg></button>
              <button class="cbtn" id="fwd" aria-label="Avançar 10 segundos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg></button>
              <span class="tc"><strong id="cur">${tc(p.pos)}</strong> / ${tc(l.dur)}</span>
              <span class="spacer"></span>
              <button class="speed" id="speed" aria-label="Velocidade">${SPEEDS[speedIdx]}×</button>
              <span class="tag">2160p</span>
            </div>
          </div>
        </div>
        <div class="lesson-head">
          <div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="eyebrow">${l.module.code} · Aula ${String(l.n).padStart(2,'0')}</span><h1>${esc(l.title)}</h1></div>
          <button class="btn btn-ghost done-btn ${p.done?'is-done':''}" id="done">${p.done?'✓ Concluída':'Marcar como concluída'}</button>
        </div>
        <div class="tabs" role="tablist">${tabs.map((t,k)=>`<button role="tab" data-t="${t[0]}" aria-selected="${k===0}">${t[0]==='prova'&&S.quiz[l.id]?`Prova · ${S.quiz[l.id].best}/${S.quiz[l.id].total}`:t[1]}</button>`).join('')}</div>
        <div id="panel" class="tabpanel"></div>
        <div class="pager">
          ${prev?`<a class="btn btn-ghost" href="#${prev.id}">← ${esc(prev.title)}</a>`:'<span></span>'}
          ${next?`<a class="btn btn-primary" href="#${next.id}">Próxima: ${esc(next.title)} →</a>`:''}
        </div>
      </div>
      <aside class="list">
        <header><b>Conteúdo do curso</b><div class="bar"><i style="width:${(s.pct*100).toFixed(1)}%"></i></div><span class="mono" style="font-size:12px;color:var(--muted)">${s.done} de ${LESSONS.length} aulas concluídas</span></header>
        ${list}
      </aside>
    </div>`;
}
function panel(l, t){
  const el=document.getElementById('panel');
  if(t==='sobre') el.innerHTML = `<p>${esc(l.summary)}</p>
    <div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">O que você vai ver</span><ul class="topics">${l.topics.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    ${l.nodes.length?`<div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Nodes usados</span><div class="nodes">${l.nodes.map(n=>`<span class="node">${esc(n)}</span>`).join('')}</div></div>`:''}
    ${l.specs?`<div class="specs">${l.specs.map(s=>`<div><span>${esc(s[0])}</span><strong>${esc(s[1])}</strong></div>`).join('')}</div>`:''}`;
  if(t==='materiais') el.innerHTML = `<p>Baixe tudo antes de começar. O script já aponta para a pasta <span class="mono">footage/</span>, então mantenha a mesma estrutura.</p>
    <div class="files">${l.files.map(f=>`<div class="file"><span class="ext ${f[0]}">.${f[0]}</span><div style="min-width:0"><div class="n">${esc(f[1])}</div><div class="r">${esc(f[2])}</div></div><span class="sz">${esc(f[3])}</span><button class="btn btn-ghost dl" style="padding:7px 12px">Baixar</button></div>`).join('')}</div>`;
  if(t==='exercicio'){
    const st=S.steps[l.id]||(S.steps[l.id]=[]);
    el.innerHTML = `<p>Refaça a aula sozinho e envie o seu render. Marque cada etapa conforme for avançando.</p>
      <div class="steps">${l.exercise.map((x,k)=>`<label class="step ${st[k]?'ok':''}"><input type="checkbox" id="st-${l.id}-${k}" data-k="${k}" ${st[k]?'checked':''}><span>${esc(x)}</span></label>`).join('')}</div>
      <div class="deliver"><div><strong>Entrega</strong><div style="color:var(--muted);font-size:13.5px">Arquivo .mov ou .mp4 com o seu resultado. O professor comenta em até 3 dias.</div></div><button class="btn btn-primary dl" id="send">Enviar meu render</button></div>`;
  }
  if(t==='prova'){ quizPanel(l, el); return; }
  if(t==='notas') el.innerHTML = `<p style="color:var(--muted)">Suas anotações desta aula. Ficam salvas neste navegador.</p><textarea id="notes-${l.id}" placeholder="Ex.: 12:40, por que o FrameHold vem antes do RotoPaint?">${esc(S.notes[l.id]||'')}</textarea>`;
  el.querySelectorAll('.dl').forEach(b=>b.onclick=()=>toast('Na plataforma real, esse botão baixa ou envia o arquivo.'));
  el.querySelectorAll('.step input').forEach(c=>c.onchange=()=>{ S.steps[l.id][c.dataset.k]=c.checked; c.closest('.step').classList.toggle('ok',c.checked); save(); });
  const ta=el.querySelector('textarea'); if(ta) ta.oninput=()=>{ S.notes[l.id]=ta.value; save(); };
}
function quizPanel(l, el){
  const qs=QUIZ[l.id], r=S.quiz[l.id];
  el.innerHTML = `<div class="quiz" id="quiz">
    <div class="qhead"><p style="margin:0">Responda para conferir o que ficou da aula. A correção sai na hora e a sua melhor nota fica no progresso.</p>${r?`<span class="qbadge ${r.best/r.total>=PASS?'ok':''}">Melhor nota: ${r.best}/${r.total}</span>`:''}</div>
    ${qs.map((x,i)=>`<fieldset class="q" data-i="${i}"><legend><span class="n">Pergunta ${i+1} de ${qs.length}</span>${esc(x.q)}</legend>
      ${x.o.map((o,k)=>`<label class="opt"><input type="radio" name="q${i}" value="${k}"><span>${esc(o)}</span></label>`).join('')}
      <p class="why">${esc(x.why)}</p></fieldset>`).join('')}
    <p class="err" id="qerr" role="alert" style="color:#e8a39a;margin:0;min-height:1.2em"></p>
    <div id="qres"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" id="qsend">Corrigir prova</button><button class="btn btn-ghost" id="qagain" hidden>Refazer</button></div>
  </div>`;
  const box=el.querySelector('#quiz');
  el.querySelector('#qsend').onclick=()=>{
    const ans=qs.map((x,i)=>{ const c=box.querySelector(`input[name="q${i}"]:checked`); return c? +c.value : null; });
    if(ans.includes(null)){ el.querySelector('#qerr').textContent=`Falta responder ${ans.filter(a=>a===null).length} pergunta(s).`; return; }
    el.querySelector('#qerr').textContent='';
    let ok=0; qs.forEach((x,i)=>{ const opts=box.querySelectorAll(`fieldset[data-i="${i}"] .opt`); opts[x.a].classList.add('right'); if(ans[i]===x.a) ok++; else opts[ans[i]].classList.add('wrong'); });
    box.querySelectorAll('input').forEach(i=>i.disabled=true); box.classList.add('checked');
    const prev=S.quiz[l.id]; S.quiz[l.id]={best:Math.max(ok, prev?prev.best:0), total:qs.length, last:ok, at:Date.now()}; save(); refreshList(l);
    const pass=ok/qs.length>=PASS;
    el.querySelector('#qres').innerHTML=`<div class="score ${pass?'pass':''}"><b>${ok}/${qs.length}</b><div><strong>${pass?'Mandou bem!':'Quase lá.'}</strong><div style="color:var(--muted);font-size:14px">${pass?'Você pode seguir para a próxima aula.':'Revise os pontos marcados e tente de novo. Para passar são '+Math.ceil(PASS*qs.length)+' acertos.'}</div></div></div>`;
    el.querySelector('#qsend').hidden=true; el.querySelector('#qagain').hidden=false;
    toast(`Prova corrigida: ${ok} de ${qs.length}.`);
  };
  el.querySelector('#qagain').onclick=()=>quizPanel(l, el);
}

}

    <div class="community">
      <div class="ccard"><h2>O que tem lá</h2><ul class="chans">${chans.map(c=>`<li><b>${c[0]}</b><span>${c[1]}</span></li>`).join('')}</ul></div>
      <div class="ccard" style="justify-content:space-between"><div style="display:flex;flex-direction:column;gap:10px"><h2>Como entrar</h2><p style="margin:0;color:var(--muted)">Clique no botão, aceite o convite e use o mesmo e-mail da assinatura para liberar os canais de aluno.</p></div>
        <button class="btn btn-primary" id="joinDiscord">Entrar no Discord</button>

}
function bindLesson(l){
  const p=P(l.id);
  const upd=()=>{ const f=Math.min(p.pos/l.dur,1)*100; document.getElementById('fill').style.width=f+'%'; document.getElementById('knob').style.left=f+'%'; document.getElementById('cur').textContent=tc(p.pos); };
  const setPlay=on=>{ clearInterval(timer); timer=null; document.getElementById('screen').classList.toggle('playing',on);
    document.getElementById('ppIc').innerHTML = on? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4.5v15l13-7.5z"/>';
    document.getElementById('pp').setAttribute('aria-label', on?'Pausar':'Reproduzir');
    if(on) timer=setInterval(()=>{ p.pos=Math.min(p.pos+0.25*SPEEDS[speedIdx]*8, l.dur); upd(); if(p.pos/l.dur>0.95 && !p.done) markDone(true); if(p.pos>=l.dur) setPlay(false); save(); },250); };
  const toggle=()=>setPlay(!timer);
  const markDone=v=>{ p.done=v; const b=document.getElementById('done'); b.classList.toggle('is-done',v); b.textContent=v?'✓ Concluída':'Marcar como concluída'; save(); sidebar(); refreshList(l); if(v) toast(QUIZ[l.id]&&!S.quiz[l.id]?'Aula concluída! Agora faça a prova da aula.':'Aula concluída. Bom trabalho!'); };
  document.getElementById('screen').onclick=toggle;
  document.getElementById('screen').onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle();} };
  document.getElementById('pp').onclick=toggle;
  document.getElementById('back').onclick=()=>{ p.pos=Math.max(0,p.pos-10); upd(); save(); };
  document.getElementById('fwd').onclick=()=>{ p.pos=Math.min(l.dur,p.pos+10); upd(); save(); };
  document.getElementById('speed').onclick=e=>{ speedIdx=(speedIdx+1)%SPEEDS.length; e.currentTarget.textContent=SPEEDS[speedIdx]+'×'; };
  const sc=document.getElementById('scrub');
  sc.onclick=e=>{ const r=sc.getBoundingClientRect(); p.pos=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*l.dur; upd(); save(); };
  sc.onkeydown=e=>{ if(e.key==='ArrowRight'){p.pos=Math.min(l.dur,p.pos+5);upd();} if(e.key==='ArrowLeft'){p.pos=Math.max(0,p.pos-5);upd();} };
  document.getElementById('done').onclick=()=>markDone(!p.done);
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b)); panel(l,b.dataset.t); });
  panel(l,'sobre'); upd();
}
function refreshList(l){ document.querySelectorAll('.list .litem[href]').forEach(a=>{ const x=LESSONS.find(y=>'#'+y.id===a.getAttribute('href')); a.querySelector('.state').outerHTML=stateIcon(x); }); const tb=document.querySelector('.tabs button[data-t="prova"]'); const rq=S.quiz[l.id]; if(tb&&rq) tb.textContent=`Prova · ${rq.best}/${rq.total}`; const s=stats(); const h=document.querySelector('.list header'); if(h){ h.querySelector('.bar i').style.width=(s.pct*100).toFixed(1)+'%'; h.querySelector('span').textContent=`${s.done} de ${LESSONS.length} aulas concluídas`; } }

function modStats(m){ const ls=m.lessons||[]; const done=ls.filter(l=>P(l.id).done).length; const tot=ls.reduce((a,l)=>a+l.dur,0)||1; const w=ls.reduce((a,l)=>a+(P(l.id).done?l.dur:Math.min(P(l.id).pos,l.dur)),0); return {done, n:ls.length, pct:w/tot}; }
function modCards(){
  return `<div class="mgrid">${COURSE.map(m=>{ if(m.soon) return `<div class="mcard later"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="code">${m.code}</span><span class="tag">Em breve</span></div><h3>${esc(m.title)}</h3><p>${esc(m.note)}</p></div>`;
    const ms=modStats(m); return `<a class="mcard" href="#${m.id}"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="code">${m.code}</span><span class="eyebrow">${esc(m.tool)}</span></div><h3>${esc(m.title)}</h3><p>${esc(m.desc||'')}</p>
      <div class="mfoot"><div class="bar"><i style="width:${(ms.pct*100).toFixed(1)}%"></i></div><span class="mono" style="font-size:12.5px;color:var(--muted)">${ms.done} de ${ms.n} aulas · ${Math.round(ms.pct*100)}%</span></div></a>`; }).join('')}</div>`;
}
function modulesView(){
  return `<div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Curso</span><h1 style="font-size:34px">Módulos</h1><p style="margin:0;color:var(--muted);max-width:60ch">Cada módulo tem um código. Os que começam com NK são de Nuke e os com FL são de Flame. Novos módulos aparecem aqui assim que são publicados.</p></div>${modCards()}`;
}
function moduleView(m){
  const ms=modStats(m);
  return `<div class="crumbs"><a href="#inicio">Início</a><span>›</span><a href="#modulos">Módulos</a><span>›</span><span style="color:var(--fg)">${m.code}</span></div>
    <div class="mhead"><div style="display:flex;gap:10px;align-items:center"><span class="code">${m.code}</span><span class="eyebrow">${esc(m.tool)}</span></div><h1>${esc(m.title)}</h1><p>${esc(m.desc||'')}</p>
      <div style="display:flex;flex-direction:column;gap:6px;max-width:420px"><div class="bar"><i style="width:${(ms.pct*100).toFixed(1)}%"></i></div><span class="mono" style="font-size:12.5px;color:var(--muted)">${ms.done} de ${ms.n} aulas concluídas · mais aulas em gravação</span></div></div>
    <div class="lessons">${m.lessons.map(l=>{ const pp=P(l.id), pc=pp.done?100:Math.round(pp.pos/l.dur*100); return `
      <a class="lrow" href="#${l.id}">${stateIcon(l)}
        <div style="min-width:0"><div class="t">${esc(l.title)}</div><div class="s">${esc(l.summary)}</div></div>
        <span class="d">${qBadge(l)} ${fmt(l.dur)}</span>
        <div class="pc bar" title="${pc}% assistido"><i style="width:${pc}%"></i></div></a>`}).join('')}</div>`;
}
function exercises(){
  const ex = LESSONS.filter(l=>l.exercise).map(l=>{ const st=(S.steps[l.id]||[]).filter(Boolean).length; return `
    <a class="ex" href="#${l.id}">${poster(l)}<div class="b"><span class="eyebrow">${l.module.code} · Aula ${String(l.n).padStart(2,'0')}</span><h3>${esc(l.title)}</h3><p>${esc(l.summary)}</p>
      <div class="foot"><span class="mono" style="font-size:12.5px;color:var(--muted)">${st}/${l.exercise.length} etapas</span><span class="tag ${st===l.exercise.length?'':'acc'}">${st===l.exercise.length?'Pronto p/ enviar':'Em aberto'}</span></div></div></a>`; }).join('');
  const ph = ['Exercícios do Projeto Básico','Scripts de prática do Nuke'].map(t=>`
    <div class="ex ph"><div class="poster"></div><div class="b"><span class="eyebrow">NK102 · Projeto Básico</span><h3>${t}</h3><p>Os scripts da pasta do projeto entram aqui como exercícios, cada um com footage, script inicial e resultado esperado.</p><div class="foot"><span></span><span class="tag">Em breve</span></div></div></div>`).join('');
  return `<div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Prática</span><h1 style="font-size:34px">Exercícios</h1><p style="margin:0;color:var(--muted);max-width:60ch">Cada exercício traz o footage, o script da aula e o resultado de referência. Você refaz, envia o render e recebe comentário.</p></div>
    <div class="ex-grid">${ex}${ph}</div>`;
}

let toastT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }

function route(){
  clearInterval(timer); timer=null;
  const h=(location.hash||'#inicio').slice(1), v=document.getElementById('view');
  const l=LESSONS.find(x=>x.id===h);
  let r='inicio';
  if(l){ v.innerHTML=lessonView(l); bindLesson(l); r='modulos'; }
  else if(h==='exercicios'){ v.innerHTML=exercises(); r='exercicios'; }
  else if(h==='comunidade'){ v.innerHTML=community(); r='comunidade'; document.getElementById('joinDiscord').onclick=()=>{ if(DISCORD_URL) window.open(DISCORD_URL,'_blank','noopener'); else toast('O servidor do Discord ainda está sendo criado. O convite entra aqui em breve.'); }; }
  else if(h==='modulos'){ v.innerHTML=modulesView(); r='modulos'; }
  else if(COURSE.some(m=>m.id===h&&!m.soon)){ v.innerHTML=moduleView(COURSE.find(m=>m.id===h)); r='modulos'; }
  else { v.innerHTML=home(); const rs=document.getElementById('reset'); if(rs) rs.onclick=()=>{ S={prog:JSON.parse(JSON.stringify(DEFAULT)),notes:{},steps:{},quiz:{}}; save(); route(); sidebar(); toast('Prévia recomeçada.'); }; }
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===r));
  sidebar(); window.scrollTo(0,0);
}

document.getElementById('sair').onclick=()=>{ try{localStorage.removeItem('fosfena-sessao')}catch(e){} location.href='index.html'; };
