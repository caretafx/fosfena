<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinheta vfxstudio</title>
<!-- Vinheta de abertura das aulas, rodando ao vivo (SVG + fluido WebGL).
     Fica dentro de um iframe por cima do player. Parâmetros: ?code=NK101%20·%20AULA%2001&title=Como%20instalar%20o%20Nuke
     Conversa com a página da aula por postMessage: recebe {vin:'play'}, envia {vin:'ready'|'reveal'|'done'}. -->
<style>
@font-face{font-family:IS;src:url(inst600.woff2) format("woff2");font-weight:600}
@font-face{font-family:JBM;src:url(jbm500.woff2) format("woff2");font-weight:500}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;pointer-events:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
svg{display:block;position:absolute;left:0;top:0}
#bgLayer{position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(ellipse 70% 70% at 50% 44%,#2a1d40 0%,#14111d 55%,#0c0b12 100%)}
/* o fluido roda em meia resolução e é ampliado: fica leve até no celular */
#fluidHost{position:absolute;left:0;top:0;width:960px;height:540px;transform:scale(2);transform-origin:0 0}
#fluidHost canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.95;mix-blend-mode:screen}
</style></head><body>
<div id="stage">
<div id="root" style="position:absolute;left:0;top:0;width:1920px;height:1080px"><div id="bgLayer"></div><div id="fluidHost"></div>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
 <radialGradient id="bgg" cx="50%" cy="44%" r="70%"><stop offset="0" stop-color="#2a1d40"/><stop offset=".55" stop-color="#14111d"/><stop offset="1" stop-color="#0c0b12"/></radialGradient>
 <radialGradient id="flare" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFB547" stop-opacity=".55"/><stop offset=".35" stop-color="#E0A84E" stop-opacity=".18"/><stop offset="1" stop-color="#E0A84E" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-400%" y="-400%" width="900%" height="900%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10" result="b"/><feColorMatrix in="b" type="matrix" values="0 0 0 0 .61 0 0 0 0 .42 0 0 0 0 1 0 0 0 .55 0" result="c"/><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <mask id="wmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><g id="mstrokes" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="175"></g></mask>
</defs>
<g id="bg"><g id="grid" opacity=".5"></g></g>
<circle id="flareC" r="260" fill="url(#flare)" opacity="0"/>
<g id="word" filter="url(#soft)"><g id="wordInner" mask="url(#wmask)"><g id="glyphs" fill="#ECEAE4"></g></g></g>
<g id="lesson">
  <text id="lcode" x="960" y="0" text-anchor="middle" font-family="JBM" font-weight="500" font-size="30" letter-spacing="5" fill="#E0A84E"></text>
  <text id="ltitle" x="960" y="0" text-anchor="middle" font-family="IS" font-weight="600" font-size="66" letter-spacing="-1.2" fill="#ECEAE4"></text>
</g>
<g id="handBack"></g><g id="pen"></g><g id="handFront"></g>
</svg></div>
<svg id="ringSvg" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;left:0;top:0;pointer-events:none"><defs><filter id="rglow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g filter="url(#rglow)"><circle id="ring2" fill="none" stroke="#9B6BFF" opacity="0"/><circle id="ring" fill="none" stroke="#FFB547" opacity="0"/></g></svg>
</div>
<script src="fluid_vinheta.js"></script><script src="glyphs.js?v=2"></script><script src="scene.js?v=2"></script>
<script>
(function(){
  const q=new URLSearchParams(location.search), stage=document.getElementById('stage');
  const fit=()=>{ const k=Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform=`translate(${(innerWidth-1920*k)/2}px,${(innerHeight-1080*k)/2}px) scale(${k})`; };
  addEventListener('resize',fit); fit();
  setBg(true); setTransition(true); setLesson(q.get('code')||'', q.get('title')||'');
  const say=m=>parent.postMessage({vin:m},'*');
  const IRIS=1.72, END=2.25, POSTER=1.6;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing=false;
  document.fonts.ready.then(()=>{ render(POSTER); say('ready'); });
  addEventListener('message',e=>{
    if(!e.data||e.data.vin!=='play'||playing) return; playing=true;
    if(reduce){ render(POSTER); setTimeout(()=>{ say('reveal'); say('done'); },600); return; }
    let t0=null, revealed=false;
    (function f(now){ if(t0===null) t0=now; const t=Math.min((now-t0)/1000, END); render(t);
      if(!revealed&&t>=IRIS){ revealed=true; say('reveal'); }
      if(t<END) requestAnimationFrame(f); else say('done'); })(performance.now());
  });
})();
</script>
</body></html>
