<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Área do aluno · Fosfena</title>
<script src="assets/sessao.js"></script>
<script>FosfenaSessao.exigir();</script>
<meta name="description" content="Fosfena, escola de VFX. Prévia da área do aluno.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#18191C">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>body{margin:0}</style>
<link rel="stylesheet" href="assets/fx.css">
<link rel="stylesheet" href="assets/neon.css">
<style>
body{background:#141518!important}
.side{border-right:1px solid rgba(236,234,228,.08)!important;border-top:0!important;border-left:0!important;border-bottom:0!important;box-shadow:none!important}
[hidden]{display:none!important}
.mcard.later{background:rgba(38,40,46,.2)}
.continue{background:rgba(59,42,82,.7)!important;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 30px 80px -30px rgba(59,42,82,.9),inset 0 1px 0 rgba(255,255,255,.08)}
.poster{background:repeating-linear-gradient(180deg,transparent 0 35px,rgba(127,156,192,.08) 35px 36px),rgba(29,31,35,.85)!important}
.lrow,.litem{transition:background .2s}
textarea{background:rgba(20,21,24,.5)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@media (max-width:760px){.side{border-right:0!important;border-bottom:1px solid rgba(236,234,228,.08)!important}}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral fixa + área de conteúdo; na aula, player grande com a lista de aulas ao lado. Cores e fontes do guia de marca Fosfena v1.0 (tokens --fos-*): grafite, giz e um único âmbar, sem gradientes. */
:root{
  --fos-grafite:#18191C; --fos-lousa:#232529; --fos-lousa-2:#2E3036; --fos-giz:#ECEAE4; --fos-cinza:#8B8E96;
  --fos-ambar:#E0A84E; --fos-azul:#7F9CC0; --fos-roxo:#3B2A52;
  --fos-mao:"Shantell Sans", "Comic Neue", ui-rounded, system-ui, sans-serif;
  --bg:var(--fos-grafite); --panel:var(--fos-lousa); --raise:var(--fos-lousa-2); --line:rgba(236,234,228,.11);
  --fg:var(--fos-giz); --soft:#c4c3c0; --muted:#aeb0b5; --faint:var(--fos-cinza);
  --accent:var(--fos-ambar); --accent-ink:var(--fos-grafite); --link:var(--fos-azul); --focus:var(--fos-ambar);
  --f-display:"Instrument Sans", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:12px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.025em;line-height:1.1;margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:26px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;overflow-y:auto;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand svg{width:32px;height:32px;flex:none;color:var(--fg);overflow:visible}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-.035em}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--raise);color:var(--fg)}
.nav a.on{background:var(--raise);color:var(--fg)}
.nav a.on .ic{color:var(--accent)}
.ic{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:8px}
.side-foot .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
/* main */
main{min-width:0;padding-block:28px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:500}
.demo-note{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
/* home */
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.continue{background:var(--fos-roxo);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.continue .thumb{min-height:200px}
.continue .body{padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.continue h2{font-size:24px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;font-weight:600;font-size:14px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{box-shadow:inset 0 0 0 1px var(--line);color:var(--fg)}
.btn-ghost:hover{background:var(--raise)}
.stats{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:84px;height:84px;flex:none}
.ring b{font-family:var(--f-display);font-weight:600;letter-spacing:-.03em;font-size:28px;display:block;line-height:1}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv>div:nth-child(5){grid-column:1/-1}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv span{font-size:12px;color:var(--faint)}
.kv strong{font-family:var(--f-mono);font-weight:500;font-size:15px}
.module{display:flex;flex-direction:column;gap:12px}
.module-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.module-head h2{font-size:22px}
.module-head .meta{color:var(--muted);font-size:13px}
.lessons{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.lrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto 120px;gap:16px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--raise)}
.lrow .t{font-weight:600}
.lrow .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .d{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.state{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.state.done{background:var(--accent);border-color:var(--accent);color:var(--fos-grafite);font-weight:700}
.state.prog{border-color:var(--accent);color:var(--accent)}
.soon{background:var(--fos-roxo);border-radius:12px;padding:18px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;color:var(--fg)}
.soon .tag{border-color:var(--accent);color:var(--accent)}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.acc{border-color:var(--accent);color:var(--accent)}
/* poster */
.poster{position:relative;background:repeating-linear-gradient(180deg,transparent 0 35px,rgba(127,156,192,.08) 35px 36px),#1d1f23;overflow:hidden;display:flex;align-items:flex-end}
.poster .graph{position:absolute;inset:0;width:100%;height:100%}
.poster .mao{position:absolute;left:22px;top:44%;font-family:var(--fos-mao);font-weight:600;font-size:clamp(14px,1.6vw,19px);color:var(--accent);transform:rotate(-3deg)}
.poster .cap{position:relative;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.poster .num{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.06em}
.poster .ttl{font-family:var(--f-display);font-weight:600;letter-spacing:-.025em;font-size:clamp(18px,2.4vw,30px);line-height:1.1}
/* lesson page */
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.stagev{display:flex;justify-content:center}
.screen.yt{cursor:auto;background:#000}
.screen.yt .vin{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:transparent;color-scheme:normal}
.vinplay{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;background:none;border:0;padding:0}
.vinplay:hover .bigplay{transform:translate(-50%,-50%) scale(1.08)}
.vinplay.go{pointer-events:none}.vinplay.go .bigplay{opacity:0;transition:opacity .15s}
.vinplay .bigplay{top:auto;bottom:9%;box-shadow:0 0 34px -4px rgba(255,181,71,.8)}.screen.yt iframe,.screen.yt #ytp{position:absolute;inset:0;width:100%;height:100%;border:0}
.player.big{width:100%;max-width:min(100%,calc((100vh - 190px) * 16 / 9));box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.prat{display:flex;flex-direction:column;gap:16px;padding-top:26px;border-top:1px solid var(--line);scroll-margin-top:20px}
.prat-h{display:flex;flex-direction:column;gap:6px}.prat-h h2{font-size:24px;margin:0}.prat-h p{margin:0;color:var(--muted)}
.crumbs{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.crumbs a{color:var(--link)}.crumbs a:hover{text-decoration:underline}
.player{border-radius:var(--r);overflow:hidden;background:var(--fos-grafite)}
.screen{aspect-ratio:16/9;max-width:100%;position:relative;cursor:pointer}
.screen .poster{position:absolute;inset:0}
.bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--fos-grafite);display:grid;place-items:center;transition:transform .15s}
.screen:hover .bigplay{transform:translate(-50%,-50%) scale(1.06)}
.bigplay svg{width:26px;height:26px;margin-left:3px;color:var(--fos-grafite)}
.playing .bigplay{opacity:0}
.sample{position:absolute;top:12px;left:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:rgba(24,25,28,.8);padding:4px 8px;border-radius:6px;color:var(--muted)}
.controls{background:var(--panel);padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
.scrub{height:6px;background:var(--line);border-radius:99px;position:relative;cursor:pointer}
.scrub i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.scrub b{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--fg);transform:translate(-50%,-50%)}
.crow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cbtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.cbtn:hover{background:var(--raise)}
.cbtn svg{width:18px;height:18px}
.tc{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tc strong{color:var(--fg);font-weight:500}
.spacer{flex:1}
.speed{font-family:var(--f-mono);font-size:12.5px;padding:5px 9px;border:1px solid var(--line);border-radius:6px}
.lesson-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.lesson-head h1{font-size:30px}
.done-btn.is-done{background:var(--accent);color:var(--fos-grafite);box-shadow:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:10px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.tabpanel{display:flex;flex-direction:column;gap:16px;max-width:72ch}
.tabpanel p{margin:0;color:var(--soft)}
.topics{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--soft)}
.nodes{display:flex;flex-wrap:wrap;gap:6px}
.node{font-family:var(--f-mono);font-size:12.5px;padding:4px 10px;border-radius:8px;background:var(--raise)}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.specs div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.specs span{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.specs strong{font-family:var(--f-mono);font-weight:500;font-size:14px}
.files{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.file{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.file:first-child{border-top:0}
.ext{font-family:var(--f-mono);font-size:11px;font-weight:500;width:40px;height:30px;border-radius:6px;display:grid;place-items:center;background:var(--raise);color:var(--muted);border:1px solid var(--line)}
.ext.nk{color:var(--accent);border-color:rgba(224,168,78,.4)}
.file .n{font-family:var(--f-mono);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .r{font-size:12.5px;color:var(--muted)}
.file .sz{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.step input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px}
.step.ok span{color:var(--muted);text-decoration:line-through}
.quiz{display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.q{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q legend{font-weight:600;padding:0;margin-bottom:4px;float:left;width:100%}
.q .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:block;margin-bottom:4px;font-weight:400}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover{border-color:rgba(155,107,255,.6)}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt.right{border-color:#5fd38d;background:rgba(95,211,141,.1)}
.opt.wrong{border-color:#e8746a;background:rgba(232,116,106,.1)}
.q .why{font-size:13.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:10px;display:none}
.quiz.checked .why{display:block}
.quiz.checked .opt{cursor:default}
.score{display:flex;gap:16px;align-items:center;padding:16px;border-radius:12px;background:rgba(155,107,255,.12);border:1px solid rgba(155,107,255,.45)}
.score b{font-family:var(--f-display);font-size:40px;letter-spacing:-.03em;line-height:1}
.score.pass b{color:var(--accent)}
.qbadge{font-family:var(--f-mono);font-size:11.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.qbadge.ok{border-color:rgba(255,181,71,.6);color:var(--accent)}
.comm-cta{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;padding:16px 18px;border-radius:14px;background:linear-gradient(120deg,rgba(155,107,255,.26),rgba(92,200,255,.12));border:1px solid rgba(155,107,255,.55);box-shadow:0 0 24px -8px rgba(155,107,255,.7)}
.comm-cta .ic2{width:34px;height:34px;flex:none;color:var(--neon-ciano,#7F9CC0)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cbrand{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 10px 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.cbrand b{font-size:15px}.cbrand span{font-family:var(--f-mono);font-size:10.5px;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.cnote{margin-top:auto;padding:12px 10px 4px;font-size:11.5px;line-height:1.45;color:var(--faint)}
.cnote button{display:inline!important;padding:0!important;text-decoration:underline;color:var(--muted)!important;font-size:11.5px!important}
body.full main{padding:0}
body.full .wrap{max-width:none;gap:0}
body.full .chat{height:100vh;height:100dvh;border:0;border-radius:0;background:rgba(14,12,24,.62)}
.chat{display:grid;grid-template-columns:230px 1fr;height:calc(100vh - 150px);min-height:520px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(20,16,34,.55)}
.chans{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;background:rgba(12,11,18,.35)}
.chans .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 10px}
.chans button{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500;font-size:14.5px}
.chans button:hover{background:var(--raise);color:var(--fg)}
.chans button.on{background:rgba(155,107,255,.18);color:var(--fg);box-shadow:inset 2px 0 0 var(--neon-ambar,#E0A84E)}
.chans button i{font-style:normal;color:var(--neon-ciano,#7F9CC0);font-family:var(--f-mono)}
.chans button .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.croom{display:flex;flex-direction:column;min-width:0;min-height:0}
.chead{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.chead b{font-size:16px}.chead span{color:var(--muted);font-size:13.5px}
.msgs{flex:1;overflow-y:auto;padding:12px 8px 12px 12px;display:flex;flex-direction:column;gap:2px}
.msg{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:8px 10px;border-radius:10px;position:relative}
.msg:hover{background:rgba(236,234,228,.04)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;color:#140c00}
.mmeta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.mmeta b{font-size:14.5px}.mmeta time{font-size:12px;color:var(--faint)}
.role{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;background:rgba(255,181,71,.15);color:var(--neon-ambar,#E0A84E);border:1px solid rgba(255,181,71,.45)}
.mtext{white-space:pre-wrap;word-wrap:break-word;line-height:1.45;font-size:14.5px}
.mimg{margin-top:6px;max-width:min(360px,100%);max-height:260px;border-radius:10px;border:1px solid var(--line);display:block;cursor:zoom-in;object-fit:cover}
.quote{font-size:12.5px;color:var(--muted);border-left:2px solid rgba(155,107,255,.7);padding:2px 8px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.mact{position:absolute;right:10px;top:-10px;display:none;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.msg:hover .mact,.msg:focus-within .mact{display:flex}
.mact button{padding:4px 8px;border-radius:6px;font-size:12.5px;color:var(--muted)}.mact button:hover{background:var(--raise);color:var(--fg)}
.reacts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

<script>
const COURSE = [
  { id:'NK101', course:'nuke', code:'NK101', tool:'Nuke', title:'Fundamentos do Nuke', desc:'Tudo o que você precisa para começar a trabalhar no Nuke, da instalação aos primeiros trabalhos de comp.', lessons:[
    { id:'aula-1', n:1, title:'Como instalar o Nuke', dur:270.22,
      summary:'Apresentação do curso e da licença gratuita. Você cria a conta no site da Foundry, pega a licença Non-commercial e deixa o Nuke instalado para a próxima aula.',
      topics:['Como o curso funciona e quem vai te guiar','Licença Non-commercial: gratuita, com algumas limitações','Criar a conta na Foundry e pegar o trial','Ativar a licença e instalar o Nuke'],
      nodes:[], files:[] },
    { id:'aula-2', n:2, title:'Iniciando o Nuke', dur:1189.07,
      summary:'Primeiro tour pelo Nuke. Você conhece os painéis principais, entende o que o Viewer mostra e deixa a interface configurada para trabalhar.',
      topics:['Viewer, Node Graph e Properties: ver, trabalhar e ajustar','Curve Editor, Dope Sheet e os painéis que podem esperar','Canais RGBA, alpha e controles de visualização do Viewer','Timeline: frame range, fps, in e out','Large Viewer (Shift + F3), Preferences e atalhos que dependem do mouse'],
      nodes:['Viewer'], files:[] },
    { id:'aula-3', n:3, title:'Primeiro apagamento', dur:2412.73, note:'congela, pinta, reaplica ↘',
      summary:'Seu primeiro cleanup de verdade. A partir de um plano vertical, você trackeia a cena, congela um frame limpo, pinta o patch e projeta de volta no movimento original.',
      topics:['Project Settings, formato vertical e organização de pastas','Clean plate com RotoPaint e FrameHold','Tracking de pontos e reference frame','Recorte do patch com Roto e Merge em mask','CornerPin para o movimento planar e render com Write'],
      nodes:['Read','Tracker4','FrameHold','RotoPaint','Roto','CornerPin2D','Transform','Merge2','Write'],
      specs:[['Formato','2160 × 3840'],['Frames','1 – 101'],['FPS','24'],['Orientação','Vertical']],
      exercise:['Abra o aula03_v01.nk ou comece do zero com o ftg.mov','Trackeie a área a ser apagada com Tracker','Escolha um frame de referência e congele com FrameHold','Pinte o clean plate no RotoPaint','Recorte o patch com Roto e reaplique o movimento com CornerPin','Renderize o resultado de 1 a 101 e compare com aula03_v01.mov'],
      files:[['mov','ftg.mov','Footage da aula','362 MB'],['nk','aula03_v01.nk','Script do Nuke','223 KB'],['mov','aula03_v01.mov','Resultado de referência','354 MB']] },
    { id:'aula-4', n:4, title:'Primeira tela', dur:1585.43, note:'a matte manda em tudo ↘',
      summary:'Substituição de tela. Você extrai a tela com um keyer, trackeia o movimento, encaixa a nova imagem e integra com cor, blur e bordas.',
      topics:['Reformat do footage 4K para o projeto HD','Keyer em Green Screen e leitura do alpha','Matte com Roto, Invert, FilterErode e Blur','Copy, Premult e despill com HueCorrect','Fundo com CheckerBoard em Merge under, Grade e render de 1 a 65'],
      nodes:['Read','Keyer','Tracker4','Roto','FilterErode','Blur','Invert','Copy','Premult','Grade','HueCorrect','Reformat','CheckerBoard2','Transform','Merge2','Write'],
      specs:[['Formato do render','1920 × 1080'],['Frames','1 – 65'],['FPS','24'],['Footage','4K DCP']],
      exercise:['Leia o ftg.mov e extraia a tela com Keyer','Limpe a matte com FilterErode e Blur','Trackeie os cantos da tela','Encaixe uma imagem nova no lugar (use o CheckerBoard para testar)','Ajuste cor com Grade e HueCorrect para integrar','Renderize em 1920 × 1080, frames 1 a 65'],
      files:[['mov','ftg.mov','Footage da aula','363 MB'],['nk','aula04_v01.nk','Script do Nuke','27 KB'],['mov','aula04_v01.mov','Resultado de referência','56 MB']] },
  ]},
  { id:'NK102', course:'nuke', code:'NK102', tool:'Nuke', title:'Projeto Básico Nuke', soon:true, note:'Exercícios de um projeto completo, cada um com footage, script inicial e resultado esperado.' },
  { id:'FL101', course:'flame', code:'FL101', tool:'Flame', title:'Fundamentos do Flame', soon:true, note:'Primeiros passos no Flame. Aulas em gravação.' },
];
const COURSES = [ {id:'nuke', title:'Curso de Nuke', pill:'NK', status:'No ar'}, {id:'flame', title:'Curso de Flame', pill:'FL', status:'Em breve', soon:true} ];
const LESSONS = COURSE.flatMap(m => (m.lessons||[]).map(l => ({...l, module:m})));
const TOTAL = LESSONS.reduce((s,l)=>s+l.dur,0);

// Provas do fim de cada aula, feitas a partir das transcrições: ficam em assets/nk101-pratica.js (window.FOS_PROVAS).
// a = índice da resposta certa; duvida = {in,out} em segundos no vídeo da aula.
const QUIZ = window.FOS_PROVAS || {};
const PASS = 0.7;


// Progresso de exemplo para o preview; salvo só neste navegador.
const DEFAULT = { 'aula-1':{pos:270.22,done:true}, 'aula-2':{pos:512,done:false} };
const KEY = 'fosfena-preview-v1';
let S = load();
function load(){ try{ const v = JSON.parse(localStorage.getItem(KEY)); if(v && v.prog){ v.quiz=v.quiz||{}; return v; } }catch(e){} return {prog:JSON.parse(JSON.stringify(DEFAULT)), notes:{}, steps:{}, quiz:{}}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const P = id => S.prog[id] || (S.prog[id] = {pos:0,done:false});

const fmt = s => { s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h? `${h}h${String(m).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`; };
const fmtMin = s => { const m=Math.round(s/60); return m>=60? `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}` : `${m} min`; };
const tc = s => { const f=Math.floor((s%1)*30), t=Math.floor(s); return [Math.floor(t/3600),Math.floor(t%3600/60),t%60,f].map(v=>String(v).padStart(2,'0')).join(':'); };
const esc = t => String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function stats(){
  const done = LESSONS.filter(l=>P(l.id).done).length;
  const watched = LESSONS.reduce((s,l)=>s+(P(l.id).done? l.dur : Math.min(P(l.id).pos,l.dur)),0);
  return {done, watched, pct: watched/TOTAL};
}
function quizAvg(){ const r=Object.values(S.quiz||{}); if(!r.length) return null; return r.reduce((a,x)=>a+x.best/x.total,0)/r.length; }
function qBadge(l){ const r=(S.quiz||{})[l.id]; if(!QUIZ[l.id]) return ''; return r? `<span class="qbadge ${r.best/r.total>=PASS?'ok':''}" title="Melhor nota na prova">Prova ${r.best}/${r.total}</span>` : `<span class="qbadge" title="Prova ainda não feita">Prova</span>`; }
function nextLesson(){ return LESSONS.find(l=>!P(l.id).done) || LESSONS[LESSONS.length-1]; }

// Pôster: mini node graph da aula (ou o título, se a aula não tem nodes)
function poster(l, big){
  const nodes = (l.nodes||[]).slice(0, big?9:7);
  let g = '';
  if(nodes.length){
    const W=640,H=360, cols=Math.min(nodes.length,3), x0=W*0.38;
    const pts = nodes.map((n,i)=>({n, x: x0 + (i%cols)*((W-x0-40)/Math.max(cols,1)) + (Math.floor(i/cols)%2? 40:0), y: 34 + Math.floor(i/cols)*58}));
    let lines='', boxes='';
    pts.forEach((p,i)=>{ if(i){ const q=pts[i-1]; lines+= q.y===p.y ? `<path d="M${q.x+92} ${q.y+12} L${p.x} ${p.y+12}" stroke="#8B8E96" stroke-opacity=".7" stroke-width="1.5" fill="none"/>` : `<path d="M${q.x+46} ${q.y+24} C${q.x+46} ${q.y+44}, ${p.x+46} ${p.y-20}, ${p.x+46} ${p.y}" stroke="#8B8E96" stroke-opacity=".7" stroke-width="1.5" fill="none"/>`; }

  } else {

  }

function quizPanel(l, el){

    <div class="qhead"><p style="margin:0">Responda para conferir o que ficou da aula. A correção sai na hora e a sua melhor nota fica no progresso.</p>${r?`<span class="qbadge ${r.best/r.total>=PASS?'ok':''}">Melhor nota: ${r.best}/${r.total}</span>`:''}</div>

  </div>`;
  const box=el.querySelector('#quiz');
  box.querySelectorAll('.qhelp').forEach(b=>b.onclick=()=>FosPratica.openClip(l, qs[+b.dataset.q].duvida));
  el.querySelector('#qsend').onclick=()=>{
    const ans=qs.map((x,i)=>{ const c=box.querySelector(`input[name="q${i}"]:checked`); return c? +c.value : null; });
    if(ans.includes(null)){ el.querySelector('#qerr').textContent=`Falta responder ${ans.filter(a=>a===null).length} pergunta(s).`; return; }
    el.querySelector('#qerr').textContent='';
    let ok=0; qs.forEach((x,i)=>{ const opts=box.querySelectorAll(`fieldset[data-i="${i}"] .opt`); opts[x.a].classList.add('right'); if(ans[i]===x.a) ok++; else opts[ans[i]].classList.add('wrong'); });
    box.querySelectorAll('input').forEach(i=>i.disabled=true); box.classList.add('checked');
    const prev=S.quiz[l.id]; S.quiz[l.id]={best:Math.max(ok, prev?prev.best:0), total:qs.length, last:ok, at:Date.now()}; save(); refreshList(l);
    const pass=ok/qs.length>=PASS;
    el.querySelector('#qres').innerHTML=`<div class="score ${pass?'pass':''}"><b>${ok}/${qs.length}</b><div><strong>${pass?'Mandou bem!':'Quase lá.'}</strong><div style="color:var(--muted);font-size:14px">${pass?'Você pode seguir para a próxima aula.':'Revise os pontos marcados e tente de novo. Para passar são '+Math.ceil(PASS*qs.length)+' acertos.'}</div></div></div>`;
    el.querySelector('#qsend').hidden=true; el.querySelector('#qagain').hidden=false;
    toast(`Prova corrigida: ${ok} de ${qs.length}.`);
  };
  el.querySelector('#qagain').onclick=()=>quizPanel(l, el);
}

    const btn=e.target.closest('button'); if(!btn) return; const id=btn.closest('.msg').dataset.id, m=CH.msgs[curCh].find(x=>x.id===id);

  document.getElementById('cfile').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; if(!f.type.startsWith('image/')){ toast('Envie uma imagem (jpg, png…).'); return; }

function bindYT(l, id, onEnd){
  const p=P(l.id); let tick=null, pl=null, ready=false, priming=false;
  // A vinheta roda ao vivo num iframe por cima do player; o vídeo do YouTube entra quando o círculo de luz abre.
  const start=()=>{ const skip=(window.FOS_VIDEO_INICIO||{})[l.id]||0; return Math.max(skip, p.pos>5&&p.pos<l.dur-5?p.pos:0); };
  const make=()=>{ if(!document.getElementById('ytp')) return;
    pl=new YT.Player('ytp',{videoId:id, width:'100%', height:'100%', host:'https://www.youtube-nocookie.com',
      playerVars:{rel:0, modestbranding:1, playsinline:1, start:Math.floor(start())},
      events:{ onReady:()=>{ ready=true; },
        onStateChange:e=>{ clearInterval(tick);
          if(e.data===YT.PlayerState.PLAYING&&priming){ pl.pauseVideo(); return; }
          if(e.data===YT.PlayerState.PLAYING) tick=setInterval(()=>{ if(!document.body.contains(pl.getIframe())){ clearInterval(tick); return; } p.pos=pl.getCurrentTime(); const d=pl.getDuration()||l.dur; if(p.pos/d>0.95&&!p.done) document.getElementById('done')?.click(); save(); },1000);
          if(e.data===YT.PlayerState.ENDED) onEnd(); } } }); };
  if(window.YT&&YT.Player) make(); else { const prev=window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady=()=>{ prev&&prev(); make(); }; if(!document.getElementById('ytapi')){ const sc=document.createElement('script'); sc.id='ytapi'; sc.src='https://www.youtube.com/iframe_api'; document.head.append(sc); } }
  const vin=document.getElementById('vin'), btn=document.getElementById('vinplay'); if(!vin||!btn) return;
  const som=new Audio('vinheta/som.m4a'); som.preload='auto'; som.volume=.8;
  const finish=()=>{ removeEventListener('message',onMsg); vin.remove(); btn.remove(); };
  const reveal=()=>{ priming=false; if(ready){ pl.unMute(); pl.seekTo(start(),true); pl.playVideo(); } };
  const onMsg=e=>{ if(e.source!==vin.contentWindow||!e.data) return; if(e.data.vin==='reveal') reveal(); if(e.data.vin==='done') finish(); };
  addEventListener('message',onMsg);
  btn.onclick=()=>{ btn.classList.add('go'); som.play().catch(()=>{});
    if(ready){ priming=true; pl.mute(); pl.seekTo(start(),true); pl.playVideo(); }
    vin.contentWindow.postMessage({vin:'play'},'*');
    setTimeout(()=>{ if(document.body.contains(vin)){ reveal(); finish(); } },4000); };
}
function bindLesson(l){
  const p=P(l.id);
  const ytv=window.FosPratica&&FosPratica.ytId(FosPratica.videoFor(l.id));
  if(ytv){ const goP=()=>{ const pr=document.getElementById('prat'); if(pr) pr.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); };
    bindYT(l, ytv, goP);
    document.getElementById('done').onclick=()=>{ p.done=!p.done; const b=document.getElementById('done'); b.classList.toggle('is-done',p.done); b.textContent=p.done?'✓ Concluída':'Marcar como concluída'; save(); sidebar(); refreshList(l); if(p.done) toast(QUIZ[l.id]&&!S.quiz[l.id]?'Aula concluída! Agora faça a prova da aula.':'Aula concluída. Bom trabalho!'); };
    document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b)); panel(l,b.dataset.t); });
    panel(l,'sobre'); const pb=document.getElementById('pratBox'); if(pb) FosPratica.render(l, pb); return; }
  const upd=()=>{ const f=Math.min(p.pos/l.dur,1)*100; document.getElementById('fill').style.width=f+'%'; document.getElementById('knob').style.left=f+'%'; document.getElementById('cur').textContent=tc(p.pos); };
  const vid=document.getElementById('vid'); /* vídeo real quando a aula tem arquivo em FOS_VIDEOS; senão, simulação */
  if(vid){ vid.addEventListener('loadedmetadata',()=>{ if(p.pos>5&&p.pos<vid.duration-5) vid.currentTime=p.pos; },{once:true});
    vid.addEventListener('timeupdate',()=>{ p.pos=vid.currentTime; upd(); if(p.pos/l.dur>0.95&&!p.done) markDone(true); save(); });
    vid.addEventListener('ended',()=>{ setPlay(false); goPrat(); }); }
  const goPrat=()=>{ const pr=document.getElementById('prat'); if(pr) pr.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'}); };
  const seek=t=>{ p.pos=Math.max(0,Math.min(l.dur,t)); if(vid) vid.currentTime=p.pos; upd(); save(); };
  const setPlay=on=>{ clearInterval(timer); timer=null; if(vid){ vid.playbackRate=SPEEDS[speedIdx]; on? vid.play().catch(()=>{}) : vid.pause(); } document.getElementById('screen').classList.toggle('playing',on);
    document.getElementById('ppIc').innerHTML = on? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4.5v15l13-7.5z"/>';
    document.getElementById('pp').setAttribute('aria-label', on?'Pausar':'Reproduzir');
    if(on&&!vid) timer=setInterval(()=>{ p.pos=Math.min(p.pos+0.25*SPEEDS[speedIdx]*8, l.dur); upd(); if(p.pos/l.dur>0.95 && !p.done) markDone(true); if(p.pos>=l.dur){ setPlay(false); goPrat(); } save(); },250); };
  const toggle=()=>setPlay(vid? vid.paused : !timer);
  const markDone=v=>{ p.done=v; const b=document.getElementById('done'); b.classList.toggle('is-done',v); b.textContent=v?'✓ Concluída':'Marcar como concluída'; save(); sidebar(); refreshList(l); if(v) toast(QUIZ[l.id]&&!S.quiz[l.id]?'Aula concluída! Agora faça a prova da aula.':'Aula concluída. Bom trabalho!'); };
  document.getElementById('screen').onclick=toggle;
  document.getElementById('screen').onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle();} };
  document.getElementById('pp').onclick=toggle;
  document.getElementById('back').onclick=()=>seek(p.pos-10);
  document.getElementById('fwd').onclick=()=>seek(p.pos+10);
  document.getElementById('speed').onclick=e=>{ speedIdx=(speedIdx+1)%SPEEDS.length; e.currentTarget.textContent=SPEEDS[speedIdx]+'×'; if(vid) vid.playbackRate=SPEEDS[speedIdx]; };
  const sc=document.getElementById('scrub');
  sc.onclick=e=>{ const r=sc.getBoundingClientRect(); seek(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*l.dur); };
  sc.onkeydown=e=>{ if(e.key==='ArrowRight') seek(p.pos+5); if(e.key==='ArrowLeft') seek(p.pos-5); };
  document.getElementById('done').onclick=()=>markDone(!p.done);
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b)); panel(l,b.dataset.t); });
  panel(l,'sobre'); upd();
  const pb=document.getElementById('pratBox'); if(pb) FosPratica.render(l, pb);
}

function modStats(m){ const ls=m.lessons||[]; const done=ls.filter(l=>P(l.id).done).length; const tot=ls.reduce((a,l)=>a+l.dur,0)||1; const w=ls.reduce((a,l)=>a+(P(l.id).done?l.dur:Math.min(P(l.id).pos,l.dur)),0); return {done, n:ls.length, pct:w/tot}; }

function route(){

}
